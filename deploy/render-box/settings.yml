# Omnisearch Render-box SearXNG settings.
# Inherits all defaults, then tunes for a keyless datacenter box:
#  - JSON output format (the app queries /search?format=json)
#  - no redis -> limiter/cache disabled (only client is the Render app)
# Engine reality from Render's Oregon datacenter IP (probed live):
#  - bing is DISABLED in the default searxng engine set but answers
#    cleanly from a datacenter IP -> enable it (primary web engine)
#  - brave / duckduckgo / google cse suspend within minutes from a
#    datacenter IP ("too many requests" / captcha timeouts) and were
#    poisoning every multi-engine query with 0 results -> disable them
#  - yandex / naver / zapmeta ship disabled but answer cleanly
#    from the datacenter IP AND return local-directory results
#    (goodfirms, getlatka, startuptalky, techbehemoths, company sites)
#    for geo queries like "SaaS companies Nagpur" where bing only
#    returns definitional pages -> enable them
#  - gmx looked good on first probe but suspends with CAPTCHA from
#    the datacenter IP -> leave disabled
#  - wikipedia / wikidata stay on (always reachable, useful fallback)
#  - this build ships no mojeek/startpage/marginalia
use_default_settings: true

server:
  secret_key: "omnisearch-box-c1a94e7f2b8d5e13"
  image_proxy: false
  limiter: false

search:
  formats: [html, json]

ui:
  static_use_hash: true

engines:
  - name: bing
    disabled: false
  - name: yandex
    disabled: false
  - name: naver
    disabled: false
  - name: gmx
    disabled: false
  - name: zapmeta
    disabled: false
  - name: gmx
    disabled: true
  - name: google
    disabled: true
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: google cse
    disabled: true
