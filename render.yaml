# Render Blueprint — Project Omnisearch
# https://render.com/docs/blueprint-spec
#
# Architecture: Render hosts the FastAPI app + web UI; a separate box
# (your laptop or a $5 VPS) runs `crw serve` + SearXNG for search/scrape.
# See deploy/discovery/README.md for the discovery-box setup.
services:
  - type: web
    name: omnisearch
    runtime: python
    plan: free
    branch: main
    # pip must succeed; opencode (~185 MB) is only fetched when the LLM
    # actually runs *on Render* (mode: opencode). The two off-box LLM
    # options below (API key / laptop-tunnel proxy) need no binary.
    buildCommand: >-
      pip install -r requirements.txt || exit 1;
      if [ "$OMNISEARCH_LLM_ENABLED" = "true" ] && [ "$OMNISEARCH_LLM_MODE" = "opencode" ]; then
      curl -fsSL https://opencode.ai/install -o /tmp/opencode-install.sh &&
      sh /tmp/opencode-install.sh || exit 1;
      fi
    # Render sets $PORT; bind 0.0.0.0 (loopback-only will fail health checks).
    startCommand: >-
      export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH";
      exec python -m uvicorn main:app --host 0.0.0.0 --port ${PORT}
    healthCheckPath: /api/health
    envVars:
      # Base URL of your `crw serve` box (required for search/scrape via
      # server engine) — e.g. http://203.0.113.10:3000  [deploy/discovery/]
      - key: OMNISEARCH_DISCOVERY_SERVER_BASE_URL
        sync: false
      # Only if the box runs with CRW_AUTH__API_KEYS set (recommended).
      - key: OMNISEARCH_DISCOVERY_SERVER_API_KEY
        sync: false
      # ---- LLM (optional; heuristics without it) --------------------
      # Turn on with ONE of three transports:
      #  A) this laptop's free MiMo via the Tailscale tunnel (recommended,
      #     $0) — values printed by deploy/discovery/start-local-box.sh:
      #       OMNISEARCH_LLM_ENABLED=true   OMNISEARCH_LLM_MODE=openai
      #       OMNISEARCH_LLM_BASE_URL=https://<machine>.<tailnet>.ts.net:8443/v1
      #       OMNISEARCH_LLM_API_KEY=<llm-proxy-key>   (from outputs/)
      #       OMNISEARCH_LLM_MODEL=opencode/mimo-v2.6-flash-free
      #  B) a provider API key (OpenAI/Groq/DeepSeek/OpenRouter …) —
      #     same four keys, BASE_URL+API_KEY+MODEL of the provider.
      #  C) opencode on Render itself (MODE=opencode, slow on free tier).
      - key: OMNISEARCH_LLM_ENABLED
        value: "false"
      - key: OMNISEARCH_LLM_MODE
        value: "openai"
      - key: OMNISEARCH_LLM_BASE_URL
        sync: false
      - key: OMNISEARCH_LLM_API_KEY
        sync: false
      - key: OMNISEARCH_LLM_MODEL
        sync: false
      # Keep opencode from phoning home for updates inside the container.
      - key: OPENCODE_DISABLE_AUTOUPDATE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
