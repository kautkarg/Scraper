# Project Omnisearch — global execution settings
server:
  host: 127.0.0.1
  port: 8000

paths:
  outputs: ./outputs
  sqlite_db: ./outputs/omnisearch.db

execution:
  # Throughput ceiling for one run — "find 500 …" must be achievable.
  # Records stop at this cap OR when the queued source pages run dry.
  max_records_per_job: 500
  max_pages_per_job: 900
  max_results_per_query: 25
  max_concurrent_scrapes: 6
  request_delay_seconds: 0.2
  # Timeout for discovery HTTP calls (crw/SearXNG box). 60s covers a
  # Render-free cold start (~30-60s spin-up on the first call after idle);
  # the retry then lands on the already-waking instance.
  timeout_seconds: 60
  retry_attempts: 2
  retry_backoff_seconds: 10
  # Status codes treated as "blocked" — logged as a skip, job continues.
  block_status_codes: [401, 403, 429, 503, 999]
  # Domains never worth scraping (parked / pure noise heuristics).
  # Substring-matched against the lowercased URL in two places: the
  # discovery queue (_dedupe_urls) and the scrape client (block_patterns).
  blocked_domain_patterns:
    - "parked"
    - "domain-sale"
    - "godaddy.com/domainsearch"
    # Search-engine result pages leaked in via meta-engines (zapmeta,
    # naver, yahoo) — scraping them yields SERP chrome, never lead data.
    - "search.yahoo.com"
    - "startpage.com/do/search"
    - "google.com/search"          # also news.google.com/search, tbm=isch
    - "translate.google.com"
    - "bing.com/search"
    - "search.brave.com"
    - "duckduckgo.com/html"
    - "reddit.com/search"
    - "x.com/search"
    - "dailymotion.com/search"
    - "youtube.com/results"
    - "youtube.com/watch"          # video pages never yield structured records
    - "wikipedia.org/w/index.php"  # wiki search pages (articles still allowed)
    # Social/feed/article surfaces — queued by the planner but never contain
    # company + email rows; each one costs a scrape slot and an LLM call.
    - "linkedin.com/pulse"
    - "linkedin.com/posts"
    - "linkedin.com/feed"
    - "medium.com/tag/"            # tag archives are unrelated-article lists
    - "pinterest.com/search"
    - "ecosia.org/search"          # SERP leaked via zapmeta/naver mirrors
    - "search.naver.com"
    - "news.crunchbase.com"        # news posts, not company profiles
    - "britannica.com"             # 403 + encyclopedia articles
  user_agent: "OmnisearchBot/1.0 (+local research engine)"

discovery:
  # auto | cli | server | searxng | fallback
  #   cli     — invoke the local `crw` binary (fastCRW CLI)
  #   server  — call a self-hosted `crw serve` API (default :3000)
  #   searxng — direct SearXNG instance for search only
  #   fallback— plain local httpx fetch (scrape) + seed URLs (discovery)
  #   auto    — probe cli, then server, then searxng, then fallback
  mode: auto
  crw_bin: crw
  server_base_url: http://127.0.0.1:3000
  # Set when the remote `crw serve` runs with CRW_AUTH__API_KEYS set;
  # sent as `Authorization: Bearer <key>` to that server only.
  server_api_key: ""
  searxng_base_url: http://127.0.0.1:8888
  # Only used when nothing above is reachable — keeps the pipeline runnable.
  allow_http_fallback: true

llm:
  # Optional LLM for query formulation and markdown -> JSON mapping.
  # Disabled => deterministic heuristics are used instead.
  #
  # Three transport options (pick via `mode` + base_url/api_key, all
  # overridable with OMNISEARCH_LLM_* env vars — see render.yaml):
  #
  # mode: opencode  -> shells out to `opencode run --pure -m <model>`.
  #       This is how OpenCode Zen *free* models work (e.g. the MiMo
  #       free tier): Zen rejects direct HTTP calls with 403, but the
  #       opencode CLI attaches its own client ticket. Cost: $0.
  #       Requires opencode >= 1.18 on PATH.
  # mode: openai    -> plain HTTP to base_url/chat/completions with an
  #       API key — any OpenAI-compatible provider (OpenAI, Groq,
  #       DeepSeek, Gemini-proxy, Ollama, llama.cpp …). Best throughput
  #       for large (500+) runs.
  # mode: openai +  -> the SAME openai mode pointed at the laptop's
  #   tunnel base_url    `llm_proxy.py` published through the Tailscale
  #       funnel (https://<machine>.<tailnet>.ts.net:8443/v1) — the
  #       Render app borrows this laptop's opencode/MiMo for free.
  #
  # Enable LLM on a Render host by setting env OMNISEARCH_LLM_ENABLED=true
  # (no config file needed on the server).
  enabled: true
  mode: opencode
  model: opencode/mimo-v2.6-flash-free
  opencode_bin: opencode
  # opencode cold-start + free-tier Mimo can exceed 2 min on a 0.1-CPU box
  # (Render free) or under memory pressure — the SSE stream heartbeats so
  # the proxy tolerates it; on expiry the job falls back to heuristics.
  timeout_seconds: 240
  # -- only used when mode: openai --
  base_url: http://127.0.0.1:8080/v1
  api_key: ""
  temperature: 0.1

integrations:
  google_sheets:
    # Path to a Google service-account JSON (kept out of the repo).
    credentials_file: ./secrets/google_service_account.json
    spreadsheet_id: ""
  webhook:
    url: ""
    # Optional static headers; ${ENV_VAR} references are expanded.
    headers: {}
    timeout_seconds: 15
    max_retries: 3
    batch_size: 25
